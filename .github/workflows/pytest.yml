name: Pytest for bnlearn

on:
  push:
  pull_request:

jobs:
  test:
    name: Pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10", "3.12", "3.13"]
        exclude:
          # pgmpy does not fully support Python 3.13 on macOS yet
          - os: macos-latest
            python-version: 3.13

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -v

  build:
    name: Build and check distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import bnlearn; print(bnlearn.__version__)"
